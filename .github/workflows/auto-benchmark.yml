name: AUTO Blender stress suite (no supervision)
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'docs/START_AUTO_BENCHMARK_2026-11-20.md'

permissions:
  contents: read

# Share concurrency group with the existing manual benchmark:
# this run will queue instead of competing with a user-initiated render.
concurrency:
  group: robot-seed-benchmark
  cancel-in-progress: false

jobs:
  sweep:
    name: Sequential CPU/FPS/resolution probes
    if: ${{ !github.event.repository.private }}
    runs-on: ubuntu-latest
    timeout-minutes: 65
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Install open-source Blender and FFmpeg
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y blender ffmpeg
      - name: Validate Python and print available hardware
        run: |
          python3 -m py_compile scripts/auto_benchmark.py scripts/auto_long.py scripts/benchmark.py scripts/scene_robot_seed.py
          blender -b --python-expr 'import bpy; print("Blender", bpy.app.version_string)'
          nproc
          free -h
          df -h .
      - name: Run automatic sequential suite with overall 50-minute budget
        run: python3 scripts/auto_benchmark.py --budget-minutes 50 --per-test-minutes 8
      - name: Upload human-readable summary for phase 2
        if: ${{ always() }}
        uses: actions/upload-artifact@v6
        with:
          name: auto-sweep-summary-${{ github.run_id }}
          path: outputs/auto-benchmark/summary.json
          retention-days: 7
          if-no-files-found: warn
      - name: Upload all probe results, no JPEGs
        if: ${{ always() }}
        uses: actions/upload-artifact@v6
        with:
          name: auto-blender-all-probes-${{ github.run_id }}
          path: |
            outputs/auto-benchmark/*.md
            outputs/auto-benchmark/*.json
            outputs/auto-benchmark/*.txt
            outputs/benchmark/**/metrics.json
            outputs/benchmark/**/report.md
            outputs/benchmark/**/probe.log
          retention-days: 7
          if-no-files-found: warn

  actual_render:
    name: Automatically render safest valuable sample
    needs: [sweep]
    if: ${{ needs.sweep.result == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 80
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Download summary from first stage
        uses: actions/download-artifact@v7
        with:
          name: auto-sweep-summary-${{ github.run_id }}
          path: downloaded-sweep/
      - name: Install open-source Blender and FFmpeg
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y blender ffmpeg
      - name: Choose and render one segment within a 65-minute budget
        run: python3 scripts/auto_long.py
      - name: Upload decision, run metrics, and only a verified MP4
        if: ${{ always() }}
        uses: actions/upload-artifact@v6
        with:
          name: auto-blender-final-decision-${{ github.run_id }}
          path: |
            outputs/auto-long/*.json
            outputs/auto-long/*.md
            outputs/auto-long/*.log
            outputs/benchmark/**/metrics.json
            outputs/benchmark/**/report.md
            outputs/benchmark/**/segment.mp4
          retention-days: 7
          if-no-files-found: warn
