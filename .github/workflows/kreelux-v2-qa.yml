name: Kreelux NEW style — V2 real Blender QA

on:
  push:
    branches: [kreelux-v2-test]
    paths:
      - '.github/workflows/kreelux-v2-qa.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: kreelux-v2-qa-${{ github.ref }}
  cancel-in-progress: false

jobs:
  qa:
    name: Real Vietnamese TTS, 39 Blender stills and 24-frame motion test
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v6
      - name: Unpack independent V2 × Kreelux source (never read V1)
        run: |
          mkdir -p projects/kreelux-v2-test
          unzip -q projects/kreelux-v2-test/source_bundle.zip -d projects/kreelux-v2-test
      - name: Install genuine Blender EEVEE and Vietnamese voice dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y blender ffmpeg xvfb libgl1-mesa-dri libegl1 fonts-noto-core python3-venv unzip
          python3 -m venv .venv
          .venv/bin/pip install --disable-pip-version-check -r projects/kreelux-v2-test/requirements.txt
          blender --version | head -n 4
      - name: Validate 13 original V2 scenes, 285 frames and code integrity
        run: |
          .venv/bin/python -m unittest discover -s projects/kreelux-v2-test/tests -v
          .venv/bin/python projects/kreelux-v2-test/scripts/pipeline.py doctor
      - name: Render 39 genuine 3D EEVEE camera and animation QA stills
        run: .venv/bin/python projects/kreelux-v2-test/scripts/pipeline.py qa
      - name: Generate real Vietnamese TTS and exact word timings
        run: .venv/bin/python projects/kreelux-v2-test/scripts/prepare_audio.py
      - name: Render 24 real Blender motion frames and H.264 preview
        run: .venv/bin/python projects/kreelux-v2-test/scripts/pipeline.py smoke
      - name: Upload visual contact sheets, actual moving video, narration and timings
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: kreelux-v2-visual-qa
          path: |
            projects/kreelux-v2-test/output/contact_sheet_*.jpg
            projects/kreelux-v2-test/output/kreelux_smoke_1s.mp4
            projects/kreelux-v2-test/output/narration_vi.wav
            projects/kreelux-v2-test/output/narration_words.json
            projects/kreelux-v2-test/output/voice_alignment_report.json
          retention-days: 7
          if-no-files-found: warn
